# ============================================================================
# 数据集生成全部可调参数（唯一数据来源，实现文件不得二次声明默认值）
#
# 【单位制说明】LBM 全部在格子单位（lattice units）下运算：长度以格子间距
#   Δx=1、时间以步长 Δt=1 计。格子量不是米/秒制；物理量 ↔ 格子量的换算
#   由弦长 chord 与雷诺数 Re 隐式确定：
#       u_lb   = Ma · cs            （cs = 1/√3 ≈ 0.5774，格子声速）
#       nu_lb  = u_lb · chord / Re  （格子运动粘度）
#       tau    = nu_lb / cs² + 0.5  （松弛时间，MRT 中 s7=s8=1/tau）
#   映射回物理：Δx_phys = chord_phys / chord，Δt_phys = Δx_phys·u_lb / u_phys。
# ============================================================================
seed: 20240828          # 主随机种子：采样表与每样本派生种子均由它确定性生成；
                        #   改它 = 换一个数据集；续采时它必须与库内 meta.seed 一致
version: "0.1.0"        # 数据格式/代码版本，写入 LMDB meta/info，供下游兼容性检查
device: auto            # auto=优先 CUDA、无 GPU 回退 CPU（CPU 仅开发调试用，慢 1~2 个量级）
                        #   可显式写 cpu / cuda

# ----------------------------------------------------------------------------
# 计算域（格子单位）。域尺寸与弦长共同决定几何分辨率：弦长越大，翼型表面
# 被切成的格子越多，前缘/尾缘形状越保真；域相对弦长越大，边界对绕流的
# 约束越弱（堵塞效应越小）。内存 ≈ 9·nx·ny·batch_size·4 字节（float32）。
# ----------------------------------------------------------------------------
grid:
  nx: 512              # 流向分辨率：入口发展段(x_le) + 弦长 + 尾迹区(≈2弦长)
  ny: 256               # 法向分辨率：上下各留 ≈1.5 弦长，减弱周期边界的干扰
  chord: 128            # 翼型弦长（格子数）——几何分辨率的主旋钮；Re 以此定义
  x_le: 128             # 前缘 x 位置：入口到前缘 ≈1 弦长，让来流充分均匀化
  y_center: 128         # 弦线 y 位置：取 ny/2 使上下开旷度对称

# ----------------------------------------------------------------------------
# 求解器（D2Q9 MRT，Lallemand-Luo 2000）
# ----------------------------------------------------------------------------
solver:
  batch_size: 48         # 多样本并行批大小：共享一次迭代循环，GPU 利用率的主旋钮；
                        #   显存够就调大，基本线性摊薄循环开销
  boundary: bouzidi     # 固壁边界格式：bounce_back=全反弹（一阶半精度，翼面阶梯化）；
                        #   bouzidi=Bouzidi 插值反弹（二阶精度，用 SDF 估计壁面分数 q，
                        #   曲边翼型保真；步耗时约 ×3~4，链路数据每样本只构建一次）
  max_steps: 40000      # 单样本最大迭代步：网格/弦长加大后粘性弛豫更慢，需放宽；
                        #   超限仍未收敛的样本直接丢弃（数据集只保留稳态场）
  check_interval: 500   # 收敛检查间隔（步）：周期性把标量指标带回 CPU，不宜过小
  conv_tol: 1.0e-5      # 稳态判据：内部流体节点速度 RMS 变化/入口速度 < 此值；
                        #   与 GPU float32 精度匹配，且不随网格节点数改变尺度
  float64: false        # true=双精度（高 Re 更稳、吞吐减半）；false=单精度（默认够用）
  grid_sequence: true  # 先粗网格求解，再插值到细网格继续收敛
  grid_sequence_scale: 4
  grid_sequence_conv_tol: 1.0e-5
  torch_compile: false    # 是否编译 LBM 单步；默认关闭，建议仅在 GPU 实测后启用
  # MRT 松弛率 s0..s6（矩空间依次为 ρ,e,ε,jx,qx,jy,qy 的弛豫率；
  # 剪切矩 pxx/pxy 的 s7=s8=1/tau 由粘度决定，不在此列）。
  # 取值域 (0,2)；非剪切矩偏离 1 可抑制高 Re 下的数值色散，取 Lallemand-Luo 经典值。
  mrt_s: [1.0, 1.4, 1.4, 1.0, 1.2, 1.0, 1.2]

# ----------------------------------------------------------------------------
# 翼型几何（NACA 四位数族：m=最大弯度, p=弯度位置, t=最大厚度，均为弦长分数）
# ----------------------------------------------------------------------------
airfoil:
  n_points: 128         # 半面取样点数（余弦加密前缘）：多边形精细度，宜 ≥ 2·chord/10

# ----------------------------------------------------------------------------
# 工况采样（LHS 拉丁超立方或纯随机；采样表只由 seed+num_samples+method+区间
# 决定，保证断点续采与原计划逐位一致）
# ----------------------------------------------------------------------------
sampler:
  num_samples: 16384        # 计划样本总数；也是 LHS 的分层数（改它旧库不可直接续采）
  method: lhs           # lhs=分层均匀覆盖参数空间（推荐）| random=独立均匀
  reynolds: [500.0, 5000.0]   # 基于弦长的雷诺数范围；过低流场平庸，过高难收敛/易非定常
  mach: [0.10, 0.25]          # 来流马赫数范围（决定格子速度 U=Ma·cs）
  aoa_deg: [-5.0, 10.0]       # 攻角范围（度），正值抬头
  naca_m: [0.0, 0.06]         # 最大弯度：0=对称翼型，0.06≈强弯度（如 NACA 6412 量级）
  naca_p: [0.2, 0.6]          # 弯度位置：经典值 0.4（NACA xx40）
  naca_t: [0.08, 0.18]        # 最大厚度：0.12=NACA 0012
  tau_min: 0.52         # 松弛时间下限：远离 tau=0.5 的低粘度失稳区，提高 GPU float32 稳定性。
                        #   采样点 tau 不足时：非固定速度模式先抬 U 保 Re、再截断 U；
                        #   固定速度模式保 U 截 tau。实际生效值均以 *_lattice 记入元数据
  u_lb_max: 0.15        # 格子速度上限（格子单位 Δx/Δt，不是 m/s！）：
                        #   它真正限制的是 Ma ≈ 0.15/0.5774 ≈ 0.26，
                        #   平衡态二阶展开的压缩性误差 O(Ma²)，>0.3 即不可接受
  u_lb_fixed: null      # 固定入口速度（格子单位）；null=按 mach 采样驱动。
                        #   设定后所有样本同速，Ma 以 mach_lattice 记录实际值

# ----------------------------------------------------------------------------
# LMDB 存储（一个样本一个独立子库，便于按样本搬运/分片；只存收敛稳态场）
#   目录结构：
#     <path>/meta.lmdb/            全局信息（版本/配置快照/种子注册表）
#     <path>/sample_00000000.lmdb/ 单样本子库：record（流场+参数元数据）+ meta
# ----------------------------------------------------------------------------
storage:
  path: output/flowfield  # 数据集根目录（工作目录内）；同配置重跑自动断点续采
  map_size_mb: 64         # 每个样本子库的地址空间上限：
                          #   单样本 ≈ nx·ny·(4×4B+1B) ≈ 9MB（默认网格），按 2 倍以上预留

# ----------------------------------------------------------------------------
# 可视化（vis/run.py；只读 LMDB，PNG 写入 out_dir，均在工作目录内）
# ----------------------------------------------------------------------------
vis:
  out_dir: output/vis   # 渲染输出目录
  cmap: turbo           # 流场色图（matplotlib 色图名）
  dpi: 150              # PNG 分辨率
  num_samples: 4        # 渲染前 N 个样本；0=全部
  fields: [ux, uy, p, speed, rho]   # 横排面板：ux/uy/p/rho/speed 的任意非空子集
