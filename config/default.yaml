# ============================================================================
# 数据生成、模型与训练全部可调参数（唯一数据来源，实现文件不得二次声明默认值）
#
# 【单位制说明】LBM 全部在格子单位（lattice units）下运算：长度以格子间距
#   Δx=1、时间以步长 Δt=1 计。格子量不是米/秒制；物理量 ↔ 格子量的换算
#   由弦长 chord 与雷诺数 Re 隐式确定：
#       u_lb   = Ma · cs            （cs = 1/√3 ≈ 0.5774，格子声速）
#       nu_lb  = u_lb · chord / Re  （格子运动粘度）
#       tau    = nu_lb / cs² + 0.5  （松弛时间，MRT 中 s7=s8=1/tau）
#   映射回物理：Δx_phys = chord_phys / chord，Δt_phys = Δx_phys·u_lb / u_phys。
# ============================================================================
seed: 20240828          # 主随机种子：采样表与每样本派生种子均由它确定性生成；
                        #   改它 = 换一个数据集；续采时它必须与库内 meta.seed 一致
version: "0.2.0"        # v0.2 使用严格稳态判据、零均值压力与稳态友好 Re 范围
device: auto            # auto=优先 CUDA、无 GPU 回退 CPU（CPU 仅开发调试用，慢 1~2 个量级）
                        #   可显式写 cpu / cuda

# ----------------------------------------------------------------------------
# 计算域（格子单位）。域尺寸与弦长共同决定几何分辨率：弦长越大，翼型表面
# 被切成的格子越多，前缘/尾缘形状越保真；域相对弦长越大，边界对绕流的
# 约束越弱（堵塞效应越小）。内存 ≈ 9·nx·ny·batch_size·4 字节（float32）。
# ----------------------------------------------------------------------------
grid:
  nx: 256              # 流向分辨率：入口发展段(x_le) + 弦长 + 尾迹区(≈2弦长)
  ny: 128               # 法向分辨率：上下各留 ≈1.5 弦长，减弱周期边界的干扰
  chord: 64            # 翼型弦长（格子数）——几何分辨率的主旋钮；Re 以此定义
  x_le: 64             # 前缘 x 位置：入口到前缘 ≈1 弦长，让来流充分均匀化
  y_center: 64         # 弦线 y 位置：取 ny/2 使上下开旷度对称

# ----------------------------------------------------------------------------
# 求解器（D2Q9 MRT，Lallemand-Luo 2000）
# ----------------------------------------------------------------------------
solver:
  batch_size: 192        # 多样本并行批大小：共享一次迭代循环，GPU 利用率的主旋钮；
                        #   显存够就调大，基本线性摊薄循环开销
  boundary: bouzidi     # 固壁边界格式：bounce_back=全反弹（一阶半精度，翼面阶梯化）；
                        #   bouzidi=Bouzidi 插值反弹（二阶精度，用 SDF 估计壁面分数 q，
                        #   曲边翼型保真；步耗时约 ×3~4，链路数据每样本只构建一次）
  max_steps: 40000      # 单样本最大迭代步：网格/弦长加大后粘性弛豫更慢，需放宽；
                        #   超限仍未收敛的样本直接丢弃（数据集只保留稳态场）
  check_interval: 500   # 收敛检查间隔（步）：周期性把标量指标带回 CPU，不宜过小
  conv_tol: 1.0e-4      # 稳态判据：内部流体节点速度 RMS 变化/入口速度 < 此值；
                        #   配合连续 3 次命中，双样本比 1e-5 快 1.43~1.62 倍，速度场误差 <0.06%
  float64: false        # true=双精度（高 Re 更稳、吞吐减半）；false=单精度（默认够用）
  grid_sequence: true  # 先粗网格求解，再插值到细网格继续收敛
  grid_sequence_scale: 2
  grid_sequence_conv_tol: 1.0e-4
  grid_sequence_policy: auto # auto=已有严格稳态延续时直接细网格；always=每批都跑粗网格
  torch_compile: false    # 是否编译 LBM 单步；默认关闭，建议仅在 GPU 实测后启用
  steady_hits: 3          # 连续多少次检查达标才判稳态，避免周期流相位巧合造成假收敛
  precondition_gamma: 1.0 # 稳态预条件参数 (0,1]；越小理论加速越强，1=关闭，须实测稳定性
  initializer: potential  # uniform=均匀来流；potential=无粘源面元近似，仅作为 LBM 初值
  potential_panels: 64    # 势流初值的源面元数量（偶数）；只影响初始化成本与光滑度
  potential_blend: 1.0    # 势流场与均匀来流的混合权重；两样本实测 1.0 最快且最终场一致
  potential_speed_limit: 1.5 # 势流初值速度上限相对入口速度的倍数
  sample_continuation: true # 按有效工况/几何局部排序，并从最近已收敛样本热启动
  continuation_bank_size: 32 # CPU 中保留完整分布函数及宏观场；内存随容量和网格节点数线性增长
  # MRT 松弛率 s0..s6（矩空间依次为 ρ,e,ε,jx,qx,jy,qy 的弛豫率；
  # 剪切矩 pxx/pxy 的 s7=s8=1/tau 由粘度决定，不在此列）。
  # 取值域 (0,2)；非剪切矩偏离 1 可抑制高 Re 下的数值色散，取 Lallemand-Luo 经典值。
  mrt_s: [1.0, 1.4, 1.4, 1.0, 1.2, 1.0, 1.2]

# ----------------------------------------------------------------------------
# 翼型几何（NACA 四位数族：m=最大弯度, p=弯度位置, t=最大厚度，均为弦长分数）
# ----------------------------------------------------------------------------
airfoil:
  n_points: 128         # 半面取样点数（余弦加密前缘）：多边形精细度，宜 ≥ 2·chord/10
  sdf_chunk_cpu: 2048   # CPU 精确点到线段距离分块；实测小块可显著降低内存带宽压力
  sdf_chunk_cuda: 16384 # CUDA 使用大块减少 kernel 启动次数
  # SDF 前向仍为精确 sqrt(dist²)；仅将反向分母改为 2*sqrt(dist²+epsilon²)，避免零距离 NaN。
  sdf_backward_epsilon: 1.0e-6 # 弦长归一化距离，只影响反向代理梯度，不改变任何前向值

# ----------------------------------------------------------------------------
# 工况采样（LHS 拉丁超立方或纯随机；采样表只由 seed+num_samples+method+区间
# 决定，保证断点续采与原计划逐位一致）
# ----------------------------------------------------------------------------
sampler:
  num_samples: 16384        # 计划样本总数；也是 LHS 的分层数（改它旧库不可直接续采）
  method: lhs           # lhs=分层均匀覆盖参数空间（推荐）| random=独立均匀
  reynolds: [100.0, 500.0]   # 严格稳态采集范围；当前 chord/tau/U 约束下可准确实现且较少非定常
  mach: [0.10, 0.25]          # 来流马赫数范围（决定格子速度 U=Ma·cs）
  aoa_deg: [-5.0, 10.0]       # 攻角范围（度），正值抬头
  naca_m: [0.0, 0.06]         # 最大弯度：0=对称翼型，0.06≈强弯度（如 NACA 6412 量级）
  naca_p: [0.2, 0.6]          # 弯度位置：经典值 0.4（NACA xx40）
  naca_t: [0.08, 0.18]        # 最大厚度：0.12=NACA 0012
  tau_min: 0.52         # 松弛时间下限：远离 tau=0.5 的低粘度失稳区，提高 GPU float32 稳定性。
                        #   采样点 tau 不足时：非固定速度模式先抬 U 保 Re、再截断 U；
                        #   固定速度模式保 U 截 tau。实际生效值均以 *_lattice 记入元数据
  u_lb_max: 0.15        # 格子速度上限（格子单位 Δx/Δt，不是 m/s！）：
                        #   它真正限制的是 Ma ≈ 0.15/0.5774 ≈ 0.26，
                        #   平衡态二阶展开的压缩性误差 O(Ma²)，>0.3 即不可接受
  u_lb_fixed: null      # 固定入口速度（格子单位）；null=按 mach 采样驱动。
                        #   设定后所有样本同速，Ma 以 mach_lattice 记录实际值

# ----------------------------------------------------------------------------
# LMDB 存储（一个样本一个独立子库，便于按样本搬运/分片；只存收敛稳态场）
#   目录结构：
#     <path>/meta.lmdb/            全局信息（版本/配置快照/种子注册表）
#     <path>/sample_00000000.lmdb/ 单样本子库：record（流场+参数元数据）+ meta
# ----------------------------------------------------------------------------
storage:
  path: ../data/output/flowfield-steady  # v0.2 新库，避免与旧高 Re/旧压力规约样本混合
  map_size_mb: 64         # 每个样本子库的地址空间上限：
                          #   单样本 ≈ nx·ny·(4×4B+1B) ≈ 9MB（默认网格），按 2 倍以上预留
  reader_cache_size: 16   # 每进程最多同时保持的只读样本 LMDB 句柄；防止大库扫描耗尽句柄

# ----------------------------------------------------------------------------
# 可视化（vis/run.py；只读 LMDB，PNG 写入 out_dir，均在工作目录内）
# ----------------------------------------------------------------------------
vis:
  out_dir: output/vis   # 渲染输出目录
  cmap: turbo           # 流场色图（matplotlib 色图名）
  dpi: 150              # PNG 分辨率
  num_samples: 4        # 渲染前 N 个样本；0=全部
  fields: [ux, uy, p, speed, rho]   # 横排面板：ux/uy/p/rho/speed 的任意非空子集
  training_curve_smoothing: 25 # 训练曲线的后向滑动平均窗口；原始曲线仍保留

# ----------------------------------------------------------------------------
# 训练缓存：原始流场 LMDB 始终只读，面元基线与监督残差写入独立缓存
# ----------------------------------------------------------------------------
training_data:
  cache_path: output/training-cach
  split: [0.90, 0.05, 0.05]
  split_seed: 20260831
  compression_level: 1
  prepare_batch_size: 4
  prepare_cpu_threads: 4

# ----------------------------------------------------------------------------
# 12 层流场残差 Transformer
# ----------------------------------------------------------------------------
model:
  input_channels: 4
  output_channels: 3
  patch_size: 8
  dim: 384
  depth: 12
  heads: 6
  rope_base: 100.0         # 标准化 Patch 中心坐标的二维 RoPE 频率基数
  rope_coordinate_mode: normalized_center # Patch 中心按全域映射到 [-1,1]；index 保留旧坐标消融
  ffn_hidden: 1536
  decoder_channels: [192, 96, 48]
  norm_eps: 1.0e-6
  dropout: 0.0
  multiscale_bypass:
    enabled: true
    dim: 128
    depth: 4
    patch_sizes: [4, 2]   # 分别在解码器 /4、/2 层级融合
    roi_chord: [-0.25, 1.50, -0.375, 0.50] # 当前网格对应 x=[48,160), y=[40,96)

# ----------------------------------------------------------------------------
# 单卡训练；正式训练使用自动混合精度，CPU 冒烟始终为 FP32
# ----------------------------------------------------------------------------
training:
  epochs: 100
  batch_size: 32
  gradient_accumulation: 1
  num_workers: 0
  lr: 2.0e-4
  min_lr: 5.0e-6
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  warmup_ratio: 0.05
  grad_clip: 10.0
  amp_dtype: auto
  float32_matmul_precision: high # CUDA FP32 矩阵乘启用 TF32 Tensor Core；CPU 不受影响
  torch_compile: true
  gradient_monitor: false       # 在 log_every 步统计裁剪前的逐参数梯度 RMS
  gradient_small_threshold: 1.0e-8 # 参数梯度 RMS 不高于此值视为过小
  output_dir: output/training
  checkpoint_every: 1
  log_every: 10
  max_steps: null
  smoke_min_improvement: 0.10

# 量纲已在实现中统一，以下权重只控制各约束的相对强度
loss:
  huber_delta: 0.05
  data_weight: 1.0
  edge_data_weight: 0.0   # 翼面邻域额外监督权重；常规训练关闭，微调覆盖配置中温和启用
  edge_band_cells: 4.0    # 翼面邻域半宽（格子）；由训练缓存中的精确 SDF 判定
  gradient_weight: 0.1
  divergence_weight: 0.01
  momentum_weight: 0.01
  boundary_weight: 0.05
  physics_warmup_ratio: 0.10

evaluation:
  num_visualizations: 4

# ----------------------------------------------------------------------------
# 训练模型驱动的 NACA 参数端到端优化；网格始终只由 grid 段定义且不会被优化
# ----------------------------------------------------------------------------
optimization:
  checkpoint: output/training/best.pt # 已训练模型；须与 training_data 缓存指纹一致
  output_dir: output/optimization
  steps: 4000
  learning_rate: 5.0e-4
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  grad_clip: 1.0
  log_every: 10
  # 气动力积分先取每段连续 NACA 轮廓的中点，再沿该处外法线向流体侧偏移此距离
  # （单位为网格间距），并双线性采样预测压力与速度梯度。直接在数学表面采样会混入
  # 固体掩码内被置零的速度和阶梯状界面跳变；偏移过小仍会受固体节点污染，过大则会
  # 离开近壁区。该值只决定读场位置，不移动翼型、不修改网格，也不是边界层厚度。
  surface_offset_cells: 1.5
  flow:
    u_lb: 0.10           # 固定格子流速，不是 m/s；须落在模型训练覆盖范围内
    reynolds: 300.0      # 实际格子雷诺数，据此计算 nu=u_lb*chord/Re
    aoa_deg: 4.0         # 固定来流攻角（通过旋转翼型实现）
  parameters:
    naca_m:
      bounds: [0.0, 0.06]
      initial: 0.02
      fixed: false
    naca_p:
      bounds: [0.2, 0.6]
      initial: 0.4
      fixed: false
    naca_t:
      bounds: [0.08, 0.18]
      initial: 0.12
      fixed: false
  objective:
    # 所有模式共同满足 Cl >= minimum_lift；负升力只视为不可行，不能算优化成功。
    # 违约时统一加 lift_constraint_weight*relu(minimum_lift-Cl)，持续把 Cl 推向正值。
    # maximize_lift：最小化 -Cl，适合只追求更大升力。
    # minimize_drag：最小化 Cd 的平滑绝对值，避免模型给出负阻力时反向钻空子。
    # maximize_lift_to_drag：可行区最小化 -Cl/sqrt(Cd²+drag_epsilon²)；不可行区把分子
    #                         固定为 minimum_lift，使梯度先增升、减阻，不再靠增阻改善负升阻比。
    # target_lift_min_drag：最小化 lift_weight*(Cl-target_lift)²
    #                       + drag_weight*sqrt(Cd²+drag_epsilon²)，用于满足升力约束后减阻。
    mode: maximize_lift_to_drag
    target_lift: 0.5            # 仅 target_lift_min_drag 使用
    minimum_lift: 0.01          # 所有模式的正升力硬判定门槛，必须 > 0
    lift_constraint_weight: 10.0 # 所有模式共用的正升力违约引导权重
    lift_weight: 1.0            # 仅 target_lift_min_drag 使用
    drag_weight: 0.1            # 仅 target_lift_min_drag 使用
    drag_epsilon: 1.0e-3        # 升阻比与阻力绝对值的数值稳定项
