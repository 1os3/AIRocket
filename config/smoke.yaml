# 冒烟环境：小网格、少步数、2 个样本，用于 CPU 开发平台验证端到端流程
grid:
  nx: 160
  ny: 80
  chord: 32
  x_le: 40
  y_center: 40

solver:
  batch_size: 2         # 两个样本放进同一批，覆盖并行路径
  boundary: bounce_back # 冒烟求快用全反弹；Bouzidi 路径由单独验证覆盖
  max_steps: 30000
  check_interval: 500
  conv_tol: 1.0e-5   # 冒烟仅验证流程，放宽稳态判据换速度；正式采集用 default.yaml

sampler:
  num_samples: 2
  reynolds: [200.0, 500.0]

storage:
  path: output/smoke.lmdb
  map_size_gb: 2
